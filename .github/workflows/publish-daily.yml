name: 매일 아침 브리핑 자동 다듬기·배포

# collect-daily.yml(수집)이 끝나는 즉시 이어서 실행된다.
# GitHub Actions의 예약 실행은 정각에 보장되지 않고 수십 분~몇 시간 밀리므로
# (실제로 2026-09-05 수집은 2시간 40분 지연됨) 시각을 고정하지 않고
# workflow_run으로 수집 완료를 받아 이어받는다. 수집이 실패했으면 실행하지 않는다.
# UTC 06:00(KST 15:00) 예비 실행은 workflow_run이 불발된 날을 위한 안전망 —
# 이미 처리됐으면 today.json이 없어 Claude 호출 없이 즉시 종료한다.
#
# 필요한 저장소 시크릿 (Settings → Secrets and variables → Actions):
#   CLAUDE_CODE_OAUTH_TOKEN
#     로컬 터미널에서 `claude setup-token` 실행 → 발급된 토큰을 등록.
#     Claude Pro/Max 구독으로 인증되며 유효기간은 1년(만료되면 재발급 후 교체).
#     (대안: ANTHROPIC_API_KEY 시크릿을 만들고 아래 with: 항목을
#      anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }} 로 교체 — 이 경우 API 종량 과금)
on:
  workflow_run:
    workflows: ["매일 아침 FTC 원문 자동 수집"]
    types: [completed]
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  id-token: write

concurrency:
  group: publish-daily
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # 수집이 실패한 뒤에는 이어받지 않는다(수동 실행·예비 실행은 항상 허용)
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      # 수집 워크플로우가 방금 푸시한 커밋까지 받아야 하므로 main을 명시적으로 체크아웃
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # pdfText가 비어 있을 때 PDF를 직접 열어보기 위한 pdfjs-dist 준비
      - run: npm install

      - name: git 커밋 작성자 설정
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: 처리할 수집분이 있는지 확인
        id: check
        run: |
          if [ -f tool/pending/today.json ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "tool/pending/today.json 없음 — 이번 실행은 건너뜁니다."
          fi

      - name: Claude Code로 다듬기·배포
        if: steps.check.outputs.found == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: >-
            --max-turns 80
            --allowedTools "Read,Write,Edit,Glob,Grep,Bash(git:*),Bash(node:*),Bash(ls:*),Bash(rm:*),Bash(cat:*),Bash(mkdir:*)"
          prompt: |
            저장소 루트에서 작업한다. 아래 절차를 끝까지 자동으로 수행하고, 사람의 승인을 기다리지 마라.

            tool/pending/today.json에 오늘 수집된 원문이 들어 있다(매일 같은 파일명으로 덮어씀).
            위원회 소식 PDF는 tool/pending/today-pdfs/에 있다.

            1. tool/pending/today.json을 읽고 id 값(YYYY-MM-DD, 수집 실행일)을 확인한다.

            2. items 배열이 비어 있으면(최근 24시간 내 새 게시물이 없었던 경우)
               tool/pending/today.json만 삭제하고 8번(커밋)으로 건너뛴다.

            3. items를 다음 기준으로 다듬는다:
               - press 카테고리 항목(공정위 공식 보도자료)의 headline은 그대로 사용한다(이미 공식 제목).
                 같은 사건을 다루는 news 항목이 있으면 press를 남기고 그 news 항목 쪽을
                 제외한다 — 공식 보도자료가 언론 기사보다 항상 우선한다.
                 press를 빼는 경우는 단 하나, 같은 source_url이 최근 14일 브리핑에 이미
                 실려 있을 때뿐이다(내용이 비슷하다는 이유로는 빼지 않는다).
               - press 항목의 summary는 pdfText 필드(첨부 보도자료 PDF에서 추출해둔 원문)를
                 읽어서 새로 쓴다. 이 브리핑에서 가장 중요한 자료이므로 news보다 자세히,
                 3~5문장으로 적는다. 담아야 할 것:
                   * 무엇을 하는 조치인지(제·개정, 행정예고, 처분, 조사 착수, 안내 등)
                   * 핵심 내용 — 바뀌는 기준, 부과 금액, 적용 대상, 의무 내용 등 숫자와 요건
                   * 시행일·예고기간·의견제출 기한 등 기업이 챙겨야 할 날짜
                 "담당부서: ○○과" 같은 메타정보만 적고 끝내지 말 것. pdfText가 비어 있거나
                 없으면 pdfPath의 PDF를 pdfjs-dist로 직접 열어 텍스트를 뽑는다. 그것도
                 안 되면 그때만 dept 필드를 이용해 "담당부서: ○○과" 형태로 적는다.
                 문체는 news와 같게 "~습니다"로 맞춘다.
               - committee 항목은 수집 단계에서 이미 "대상일 == 오늘"인 것만 넘어오므로
                 날짜를 다시 따지지 말고 그대로 싣는다.
               - committee 카테고리 항목은 pdfText 필드(PDF에서 이미 추출해둔 원문 텍스트)를
                 읽어서 【주요일정】,【인사발령】 섹션 내용을 추출한다. pdfText가 비어 있거나
                 없으면 pdfPath의 PDF를 pdfjs-dist로 직접 열어 텍스트를 뽑는다. 규칙:
                   * summary 필드를 "##[주요일정]##\n· **직함**: 내용\n\n##[인사발령]##\n· **이름** 직급(소속) - 내용" 형식으로 작성
                   * 사람을 가리키는 표현(위원장/부위원장/직급+이름)은 **볼드**로 감싼다
                   * 인사발령 항목 맨 앞의 문서관리번호(예: "운영지원과-1234 (5678) 2026.1.1. -" 형식)는 내용이 아니므로 제거
                   * 해당 섹션에 내용이 없으면 그 섹션은 통째로 생략, 둘 다 없으면 summary를
                     "주요일정·인사발령 내용 없음"으로
                   * pdfPath·pdfText 필드는 최종 결과물에 포함하지 말 것(로컬 전용 필드)
               - news 카테고리 항목은 제목·요약을 자연스러운 한국어 기사체로 가볍게 다듬는다
                 (원문 왜곡 금지, 매체명·기자명 같은 잡음만 정리).
               - news 중복 판정은 "같은 사건인가"로 한다. 다음 셋이 모두 같으면 같은 사건이다:
                   (1) 대상 기업·기관, (2) 행위 유형(담합·부당지원·허위표시 등),
                   (3) 처분 단계(조사 착수·심의·과징금 부과·소송 등).
                 매체가 다르고 제목 표현이 달라도 이 셋이 같으면 중복이다.
               - 오늘 수집분 안에서 같은 사건이 여러 건이면 가장 정보가 많고 신뢰도 높은
                 출처 1개만 남긴다.
               - 이미 배포된 내용과의 대조는 2단계로 한다:
                   * 먼저 docs/data/index.json 전체를 읽어 지금까지 다룬 사건의 지도를 만든다
                     (하루 한 장의 카드에 title·summary가 있어 전체 이력을 싸게 훑을 수 있다).
                   * 그다음 docs/data/briefings/ 중 파일명 날짜 내림차순으로 최근 14개 파일을
                     열어 항목 단위로 대조한다.
                 지도에 이미 있는 사건이면 몇 주 전 것이라도 중복으로 본다 — 같은 사건이
                 시차를 두고 다른 매체에서 다시 보도되는 경우가 흔하기 때문이다.
               - 다만 후속 보도라도 새로운 사실이 추가됐으면 싣는다. 새로운 사실이란
                 과징금 액수 확정, 판결 선고, 새 조사 착수, 처분 단계의 변화처럼 사건이
                 실제로 진전된 것을 말한다. 같은 사실을 다시 풀어 쓴 것이면 제외한다.
               - 이렇게 다 걸러내고 나서 남는 항목이 하나도 없으면, 새 브리핑을 만들지 말고
                 tool/pending/today.json과 tool/pending/today-pdfs/만 삭제한 뒤 8번으로 간다.

            4. id 값을 날짜로 써서:
               - docs/data/briefings/<id>.json 이 이미 있으면: 기존 items에 새 항목을
                 이어붙이고(중복 source_url 제외), title·summary를 전체 내용 기준으로
                 새로 작성한다.
               - 없으면: 새로 생성한다. items는 press → committee → news 순서로 정렬한다.
                 파일 구조는 기존 docs/data/briefings/ 파일들과 동일하게
                 (id, date, title, summary, competitors, keywords, items, generated_at) 맞춘다.
               - news 항목끼리는 아래 중요도 순서로 배열한다(위가 먼저). 화면은 배열 순서를
                 그대로 그리므로 이 순서가 곧 독자가 보는 순서다:
                   1) 진행 중인 절차 — 현장조사 착수, 심의 상정, 전원회의 회부, 공판
                   2) 제도·정책 — 법령·지침 개정, 입법 동향, 공정위 정책 발표
                   3) 확정된 처분·법원 판단 — 과징금 부과, 고발, 시정명령, 판결 선고
                   4) 해설·전망·오피니언 — 칼럼, 기고, 업계 관측, 기획기사
                 같은 단계 안에서는 과징금 규모·기업 규모·업계 파급이 큰 것을 앞에 둔다.
                 어느 단계인지 애매하면 위 단계로 올리지 말고 아래 단계에 둔다.
                 기존 파일에 이어붙이는 경우에도 news 전체를 이 기준으로 다시 정렬한다.
               - title은 30자 내외로 가장 대표성 있는 사건 중심, summary는 2~4문장으로
                 핵심 사건들을 정리한다(과장하지 말고 실제 포함된 내용만).
               - docs/data/index.json의 카드도 같은 내용으로 추가하거나 갱신한다.
                 카드 한 장은 id·date·title·summary에 아래 둘을 더한 6개 필드이며,
                 날짜 내림차순 정렬을 유지한다.
                   * counts — 그날 items의 카테고리별 건수.
                     {"press": 수, "committee": 수, "news": 수} 형식. 0건도 0으로 적는다.
                   * peek — 목록 화면 카드에 미리 보여줄 대표 항목 배열.
                     각 원소는 {"cat": "press"|"committee"|"news", "headline": "..."}.
                     아래 순서 그대로, 이 순서대로 배열에 담는다:
                       (1) press 전부. 공정위 공식 자료가 가장 중요하므로 몇 건이든
                           items에 실린 순서대로 빠짐없이 넣는다.
                       (2) committee 1건.
                       (3) news — 여기까지의 합이 4건이 안 되면 모자란 만큼 items 순서
                           (중요도 순)대로 채운다. 이미 4건 이상이면 news는 넣지 않는다.
                     press·news의 headline은 다듬은 최종 제목을 그대로 쓴다.
                     committee의 headline만은 예외로, 제목이 "2026-09-07 위원회 소식"처럼
                     날짜뿐이라 내용을 알 수 없으므로 그 항목 summary를 한 줄로 요약해 넣는다.
                     형식은 "위원장: 국무회의(청와대) · 인사발령 3건"이며 규칙은 다음과 같다:
                       - 주요일정은 한 사람 것만 쓴다. 위원장과 부위원장이 둘 다 있으면
                         위원장 것만, 한쪽만 있으면 그 한쪽을 쓴다.
                       - "직함: 일정" 형식으로 적고, 일정이 여럿이면 앞의 두 개까지
                         쉼표로 잇는다. 시각(10:00 등)은 넣지 않는다.
                       - 인사발령이 있으면 " · 인사발령 N건"을 뒤에 붙인다.
                       - 날짜는 넣지 않는다(카드에 이미 날짜가 있다).
                       - 주요일정·인사발령이 둘 다 없으면 "주요일정·인사발령 내용 없음".
               - docs/data/latest.json에 방금 만든(또는 갱신한) 브리핑 파일의 내용을 통째로
                 복사해 덮어쓴다. 가공하지 말고 <id>.json과 완전히 같은 내용이어야 한다.
                 외부 도구가 날짜를 몰라도 고정 주소 하나로 항상 최신 브리핑을 읽게 하려는
                 것이므로, 브리핑을 새로 쓰거나 갱신할 때마다 빠짐없이 함께 갱신한다.

            5. 규제동향 인사이트를 갱신한다. 대시보드(docs/dashboard.html)가 읽는 자료다.
               - docs/data/insight-latest.json을 읽는다. 지금까지 추적해 온 사건과 제도
                 변화가 누적돼 있다(파일이 없으면 cases·schedule이 빈 배열인 상태로 시작).
               - 오늘 만든 브리핑의 items만 보고 달라진 점을 반영한다. 과거 브리핑을 다시
                 읽지 말 것 — 누적된 내용은 이미 이 파일에 들어 있다.
               - cases 배열(사건 단위 추적). 각 원소는
                 {title, parties, conduct, stage, scale, last_move, last_date, source}:
                   * stage는 조사·심의·소송·수사·처분 중 하나다.
                     조사=현장조사·자료제출 등 사실관계 확인, 심의=위원회 심의,
                     소송=처분에 불복해 법원에서 다투는 중, 수사=검찰 수사·기소,
                     처분=과징금·시정명령 등 제재가 내려진 건.
                   * 이미 추적 중인 사건의 새 움직임이 오늘 브리핑에 있으면, 새 원소를
                     만들지 말고 그 원소의 stage·last_move·last_date·source를 갱신한다.
                   * 처음 등장한 사건이면 원소를 추가한다.
                   * 오늘 브리핑에 언급이 없는 사건은 손대지 말고 그대로 둔다.
                   * stage가 처분이고 last_date가 6개월 넘게 지난 건은 빼도 된다.
                   * last_move는 한 문장으로, 무엇이 어떻게 진행됐는지만 쓴다.
               - schedule 배열(법령·고시·지침의 예고·시행과 추진 중인 제도 개편).
                 각 원소는 {title, kind, date, detail, source}:
                   * kind는 시행 / 입법·행정예고 / 행정예고 / 입법예고 / 추진 / 검토 /
                     국회 발의 중 하나다.
                   * 같은 제도가 단계를 옮기면(행정예고 → 시행 등) 새로 추가하지 말고
                     기존 원소의 kind·date·detail·source를 갱신한다.
               - source에는 근거가 된 브리핑의 id(YYYY-MM-DD)를 넣는다. 화면에서 그
                 브리핑으로 링크를 걸므로 실제로 존재하는 날짜여야 한다.
               - 추측해서 쓰지 말 것. 브리핑에 실제로 실린 사실만 적고, 단계가 불분명하면
                 단계를 옮기지 않는다.
               - 갱신 결과를 docs/data/insight-latest.json에 쓰고, 같은 내용을
                 docs/data/insights/<id>.json으로도 저장한다(이력 보관).
               - 오늘 배포한 브리핑이 없으면(3번에서 남는 항목이 없었던 경우) 이 단계는 건너뛴다.

            6. 인사발령 목록을 갱신한다. 인사발령 화면(docs/personnel.html)이 읽는 자료다.
               - 오늘 브리핑에 committee 항목이 없거나 그 summary에 ##[인사발령]## 섹션이
                 없으면 이 단계는 건너뛴다.
               - docs/data/personnel.json을 읽는다(없으면 records가 빈 배열로 시작).
               - 오늘 committee 항목의 인사발령 줄을 각각 한 원소로 만들어 records 앞쪽에
                 넣는다. 같은 date와 names 조합이 이미 있으면 넣지 않는다.
               - 각 원소는 {date, names, rank, org, action, period, type, source}:
                   * date — 발령일. committee 항목 headline 앞의 날짜(대상일)를 쓴다.
                   * names — 이름 배열. "**이경주·이윤호·황주복·김윤확**"처럼 여러 명이면
                     ["이경주","이윤호","황주복","김윤확"]으로 나눈다.
                   * rank — 직급만 적는다(서기관·행정사무관·행정주사 등). 괄호는 넣지 않는다.
                   * org — 화면에서 직급 뒤 괄호 안에 그대로 들어가는 자리다. 원문에서
                     직급 뒤 괄호에 있던 내용을 통째로 옮긴다. 임용형태와 소속이 함께
                     적혀 있으면 "일반임기제, 조사관리관실 디지털포렌식담당관실"처럼
                     쉼표로 이어 한 덩어리로 넣는다. 괄호 안 내용이 없으면 "".
                     발령 내용에 해당하는 표현(예: "전문관(대리점거래 조사기획) 해제")은
                     org가 아니라 action에 넣는다.
                   * action — 발령 내용. 원문을 최대한 살리되, 근거 법령·규정 인용
                     (예: "국가공무원법 제71조 제2항 제4호", "직무대리규정 제6조")은
                     넣지 않는다.
                   * period — 기간이 적혀 있으면 원문 그대로. 없으면 "".
                   * type — 보임 / 전보 / 전입 / 파견 / 지원근무 / 직무대리 / 임용 /
                     재임용 / 복직 / 복귀 / 면직 / 휴직 / 해제 중 가장 맞는 하나.
                   * source — 근거가 된 브리핑 id(오늘 id).
               - records는 date 내림차순을 유지하고, updated 필드를 오늘 id로 갱신한다.

            7. 처리 끝난 tool/pending/today.json과 tool/pending/today-pdfs/ 폴더는 삭제한다.

            8. 변경사항을 main 브랜치에 직접 커밋하고 푸시한다. PR을 만들지 말 것.
               git 사용자 정보는 이미 설정되어 있다. 다음을 실행한다:
                 git add -A
                 git commit -m "brief: <id> (GitHub Actions 자동 배포)"
                 git push origin main
               변경사항이 없으면(git diff --cached --quiet) 커밋하지 않고 넘어간다.
               푸시가 non-fast-forward로 거부되면 git pull --rebase origin main 후 다시 푸시한다.

            9. 마지막에 무엇을 배포했는지(또는 새로 배포할 게 없었는지) 1~2문장으로 요약해 출력한다.

      # 사내 AI 툴의 오토메이션이 .json을 내려받지 못하므로(500 Internal Server Error),
      # 회람용으로 완성된 텍스트를 latest.md에 따로 만들어 둔다.
      # Claude 단계와 달리 결정적으로 동작하므로 형식이 날마다 흔들리지 않는다.
      # 새로 배포된 게 없어도 실행한다 — 수동 실행으로 latest.md만 다시 만들 수 있다.
      #
      # continue-on-error: 이 단계는 부가 산출물이다. 브리핑 본체는 위에서 이미
      # 커밋·푸시됐으므로, 여기서 실패해도 실행 전체를 "실패"로 만들지 않는다.
      # (실패하면 다음 날 실행이 다시 만든다)
      - name: 회람용 latest.md 생성·커밋
        continue-on-error: true
        run: |
          set -x
          git rev-parse --abbrev-ref HEAD
          git status --short

          node tool/pipeline/renderLatestMd.js
          if [ ! -f docs/data/latest.md ]; then
            echo "latest.md가 만들어지지 않았습니다 — 건너뜁니다."
            exit 0
          fi

          git add docs/data/latest.md
          if git diff --cached --quiet; then
            echo "latest.md 변경 없음."
            exit 0
          fi
          git commit -m "docs: 회람용 latest.md 갱신"

          # Claude 단계가 이미 푸시한 뒤라 원격에 새 커밋이 있을 일은 거의 없지만,
          # 혹시 있으면 리베이스로 얹는다. HEAD가 분리돼 있어도 동작하도록
          # 브랜치 이름 대신 HEAD를 명시적으로 main에 밀어넣는다.
          git fetch origin main
          git rebase origin/main || git rebase --abort
          git push origin HEAD:main
