name: 매일 아침 브리핑 자동 다듬기·배포

# collect-daily.yml(수집)이 끝나는 즉시 이어서 실행된다.
# GitHub Actions의 예약 실행은 정각에 보장되지 않고 수십 분~몇 시간 밀리므로
# (실제로 2026-09-05 수집은 2시간 40분 지연됨) 시각을 고정하지 않고
# workflow_run으로 수집 완료를 받아 이어받는다. 수집이 실패했으면 실행하지 않는다.
# UTC 06:00(KST 15:00) 예비 실행은 workflow_run이 불발된 날을 위한 안전망 —
# 이미 처리됐으면 today.json이 없어 Claude 호출 없이 즉시 종료한다.
#
# 필요한 저장소 시크릿 (Settings → Secrets and variables → Actions):
#   CLAUDE_CODE_OAUTH_TOKEN
#     로컬 터미널에서 `claude setup-token` 실행 → 발급된 토큰을 등록.
#     Claude Pro/Max 구독으로 인증되며 유효기간은 1년(만료되면 재발급 후 교체).
#     (대안: ANTHROPIC_API_KEY 시크릿을 만들고 아래 with: 항목을
#      anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }} 로 교체 — 이 경우 API 종량 과금)
on:
  workflow_run:
    workflows: ["매일 아침 FTC 원문 자동 수집"]
    types: [completed]
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  id-token: write

concurrency:
  group: publish-daily
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # 수집이 실패한 뒤에는 이어받지 않는다(수동 실행·예비 실행은 항상 허용)
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      # 수집 워크플로우가 방금 푸시한 커밋까지 받아야 하므로 main을 명시적으로 체크아웃
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # pdfText가 비어 있을 때 PDF를 직접 열어보기 위한 pdfjs-dist 준비
      - run: npm install

      - name: git 커밋 작성자 설정
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: 처리할 수집분이 있는지 확인
        id: check
        run: |
          if [ -f tool/pending/today.json ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "tool/pending/today.json 없음 — 이번 실행은 건너뜁니다."
          fi

      - name: Claude Code로 다듬기·배포
        if: steps.check.outputs.found == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: >-
            --max-turns 80
            --allowedTools "Read,Write,Edit,Glob,Grep,Bash(git:*),Bash(node:*),Bash(ls:*),Bash(rm:*),Bash(cat:*),Bash(mkdir:*)"
          prompt: |
            저장소 루트에서 작업한다. 아래 절차를 끝까지 자동으로 수행하고, 사람의 승인을 기다리지 마라.

            tool/pending/today.json에 오늘 수집된 원문이 들어 있다(매일 같은 파일명으로 덮어씀).
            위원회 소식 PDF는 tool/pending/today-pdfs/에 있다.

            1. tool/pending/today.json을 읽고 id 값(YYYY-MM-DD, 수집 실행일)을 확인한다.

            2. items 배열이 비어 있으면(최근 24시간 내 새 게시물이 없었던 경우)
               tool/pending/today.json만 삭제하고 6번(커밋)으로 건너뛴다.

            3. items를 다음 기준으로 다듬는다:
               - press 카테고리 항목(공정위 공식 보도자료)은 그대로 사용한다(이미 공식 제목).
                 같은 사건을 다루는 news 항목이 있으면 press를 남기고 그 news 항목 쪽을
                 제외한다 — 공식 보도자료가 언론 기사보다 항상 우선한다.
                 press를 빼는 경우는 단 하나, 같은 source_url이 최근 14일 브리핑에 이미
                 실려 있을 때뿐이다(내용이 비슷하다는 이유로는 빼지 않는다).
               - committee 항목은 수집 단계에서 이미 "대상일 == 오늘"인 것만 넘어오므로
                 날짜를 다시 따지지 말고 그대로 싣는다.
               - committee 카테고리 항목은 pdfText 필드(PDF에서 이미 추출해둔 원문 텍스트)를
                 읽어서 【주요일정】,【인사발령】 섹션 내용을 추출한다. pdfText가 비어 있거나
                 없으면 pdfPath의 PDF를 pdfjs-dist로 직접 열어 텍스트를 뽑는다. 규칙:
                   * summary 필드를 "##[주요일정]##\n· **직함**: 내용\n\n##[인사발령]##\n· **이름** 직급(소속) - 내용" 형식으로 작성
                   * 사람을 가리키는 표현(위원장/부위원장/직급+이름)은 **볼드**로 감싼다
                   * 인사발령 항목 맨 앞의 문서관리번호(예: "운영지원과-1234 (5678) 2026.1.1. -" 형식)는 내용이 아니므로 제거
                   * 해당 섹션에 내용이 없으면 그 섹션은 통째로 생략, 둘 다 없으면 summary를
                     "주요일정·인사발령 내용 없음"으로
                   * pdfPath·pdfText 필드는 최종 결과물에 포함하지 말 것(로컬 전용 필드)
               - news 카테고리 항목은 제목·요약을 자연스러운 한국어 기사체로 가볍게 다듬는다
                 (원문 왜곡 금지, 매체명·기자명 같은 잡음만 정리).
               - news 중복 판정은 "같은 사건인가"로 한다. 다음 셋이 모두 같으면 같은 사건이다:
                   (1) 대상 기업·기관, (2) 행위 유형(담합·부당지원·허위표시 등),
                   (3) 처분 단계(조사 착수·심의·과징금 부과·소송 등).
                 매체가 다르고 제목 표현이 달라도 이 셋이 같으면 중복이다.
               - 오늘 수집분 안에서 같은 사건이 여러 건이면 가장 정보가 많고 신뢰도 높은
                 출처 1개만 남긴다.
               - 이미 배포된 내용과의 대조는 2단계로 한다:
                   * 먼저 docs/data/index.json 전체를 읽어 지금까지 다룬 사건의 지도를 만든다
                     (하루 한 장의 카드에 title·summary가 있어 전체 이력을 싸게 훑을 수 있다).
                   * 그다음 docs/data/briefings/ 중 파일명 날짜 내림차순으로 최근 14개 파일을
                     열어 항목 단위로 대조한다.
                 지도에 이미 있는 사건이면 몇 주 전 것이라도 중복으로 본다 — 같은 사건이
                 시차를 두고 다른 매체에서 다시 보도되는 경우가 흔하기 때문이다.
               - 다만 후속 보도라도 새로운 사실이 추가됐으면 싣는다. 새로운 사실이란
                 과징금 액수 확정, 판결 선고, 새 조사 착수, 처분 단계의 변화처럼 사건이
                 실제로 진전된 것을 말한다. 같은 사실을 다시 풀어 쓴 것이면 제외한다.
               - 이렇게 다 걸러내고 나서 남는 항목이 하나도 없으면, 새 브리핑을 만들지 말고
                 tool/pending/today.json과 tool/pending/today-pdfs/만 삭제한 뒤 6번으로 간다.

            4. id 값을 날짜로 써서:
               - docs/data/briefings/<id>.json 이 이미 있으면: 기존 items에 새 항목을
                 이어붙이고(중복 source_url 제외), title·summary를 전체 내용 기준으로
                 새로 작성한다.
               - 없으면: 새로 생성한다. items는 press → committee → news 순서로 정렬한다.
                 파일 구조는 기존 docs/data/briefings/ 파일들과 동일하게
                 (id, date, title, summary, competitors, keywords, items, generated_at) 맞춘다.
               - news 항목끼리는 아래 중요도 순서로 배열한다(위가 먼저). 화면은 배열 순서를
                 그대로 그리므로 이 순서가 곧 독자가 보는 순서다:
                   1) 진행 중인 절차 — 현장조사 착수, 심의 상정, 전원회의 회부, 공판
                   2) 제도·정책 — 법령·지침 개정, 입법 동향, 공정위 정책 발표
                   3) 확정된 처분·법원 판단 — 과징금 부과, 고발, 시정명령, 판결 선고
                   4) 해설·전망·오피니언 — 칼럼, 기고, 업계 관측, 기획기사
                 같은 단계 안에서는 과징금 규모·기업 규모·업계 파급이 큰 것을 앞에 둔다.
                 어느 단계인지 애매하면 위 단계로 올리지 말고 아래 단계에 둔다.
                 기존 파일에 이어붙이는 경우에도 news 전체를 이 기준으로 다시 정렬한다.
               - title은 30자 내외로 가장 대표성 있는 사건 중심, summary는 2~4문장으로
                 핵심 사건들을 정리한다(과장하지 말고 실제 포함된 내용만).
               - docs/data/index.json의 카드도 같은 내용으로 추가하거나 갱신한다.
                 카드 한 장은 id·date·title·summary에 아래 둘을 더한 6개 필드이며,
                 날짜 내림차순 정렬을 유지한다.
                   * counts — 그날 items의 카테고리별 건수.
                     {"press": 수, "committee": 수, "news": 수} 형식. 0건도 0으로 적는다.
                   * peek — 목록 화면 카드에 미리 보여줄 대표 항목 배열.
                     각 원소는 {"cat": "press"|"committee"|"news", "headline": "..."}.
                     아래 순서 그대로, 이 순서대로 배열에 담는다:
                       (1) press 전부. 공정위 공식 자료가 가장 중요하므로 몇 건이든
                           items에 실린 순서대로 빠짐없이 넣는다.
                       (2) committee 1건.
                       (3) news — 여기까지의 합이 4건이 안 되면 모자란 만큼 items 순서
                           (중요도 순)대로 채운다. 이미 4건 이상이면 news는 넣지 않는다.
                     press·news의 headline은 다듬은 최종 제목을 그대로 쓴다.
                     committee의 headline만은 예외로, 제목이 "2026-09-07 위원회 소식"처럼
                     날짜뿐이라 내용을 알 수 없으므로 그 항목 summary를 한 줄로 요약해 넣는다.
                     형식은 "위원장: 국무회의(청와대) · 인사발령 3건"이며 규칙은 다음과 같다:
                       - 주요일정은 한 사람 것만 쓴다. 위원장과 부위원장이 둘 다 있으면
                         위원장 것만, 한쪽만 있으면 그 한쪽을 쓴다.
                       - "직함: 일정" 형식으로 적고, 일정이 여럿이면 앞의 두 개까지
                         쉼표로 잇는다. 시각(10:00 등)은 넣지 않는다.
                       - 인사발령이 있으면 " · 인사발령 N건"을 뒤에 붙인다.
                       - 날짜는 넣지 않는다(카드에 이미 날짜가 있다).
                       - 주요일정·인사발령이 둘 다 없으면 "주요일정·인사발령 내용 없음".
               - docs/data/latest.json에 방금 만든(또는 갱신한) 브리핑 파일의 내용을 통째로
                 복사해 덮어쓴다. 가공하지 말고 <id>.json과 완전히 같은 내용이어야 한다.
                 외부 도구가 날짜를 몰라도 고정 주소 하나로 항상 최신 브리핑을 읽게 하려는
                 것이므로, 브리핑을 새로 쓰거나 갱신할 때마다 빠짐없이 함께 갱신한다.

            5. 처리 끝난 tool/pending/today.json과 tool/pending/today-pdfs/ 폴더는 삭제한다.

            6. 변경사항을 main 브랜치에 직접 커밋하고 푸시한다. PR을 만들지 말 것.
               git 사용자 정보는 이미 설정되어 있다. 다음을 실행한다:
                 git add -A
                 git commit -m "brief: <id> (GitHub Actions 자동 배포)"
                 git push origin main
               변경사항이 없으면(git diff --cached --quiet) 커밋하지 않고 넘어간다.
               푸시가 non-fast-forward로 거부되면 git pull --rebase origin main 후 다시 푸시한다.

            7. 마지막에 무엇을 배포했는지(또는 새로 배포할 게 없었는지) 1~2문장으로 요약해 출력한다.      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      # 수집 워크플로우가 방금 푸시한 커밋까지 받아야 하므로 main을 명시적으로 체크아웃
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # pdfText가 비어 있을 때 PDF를 직접 열어보기 위한 pdfjs-dist 준비
      - run: npm install

      - name: git 커밋 작성자 설정
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: 처리할 수집분이 있는지 확인
        id: check
        run: |
          if [ -f tool/pending/today.json ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "tool/pending/today.json 없음 — 이번 실행은 건너뜁니다."
          fi

      - name: Claude Code로 다듬기·배포
        if: steps.check.outputs.found == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: >-
            --max-turns 80
            --allowedTools "Read,Write,Edit,Glob,Grep,Bash(git:*),Bash(node:*),Bash(ls:*),Bash(rm:*),Bash(cat:*),Bash(mkdir:*)"
          prompt: |
            저장소 루트에서 작업한다. 아래 절차를 끝까지 자동으로 수행하고, 사람의 승인을 기다리지 마라.

