                 실려 있을 때뿐이다(내용이 비슷하다는 이유로는 빼지 않는다).
               - committee 항목은 수집 단계에서 이미 "대상일 == 오늘"인 것만 넘어오므로
                 날짜를 다시 따지지 말고 그대로 싣는다.
               - committee 카테고리 항목은 pdfText 필드(PDF에서 이미 추출해둔 원문 텍스트)를
                 읽어서 【주요일정】,【인사발령】 섹션 내용을 추출한다. pdfText가 비어 있거나
                 없으면 pdfPath의 PDF를 pdfjs-dist로 직접 열어 텍스트를 뽑는다. 규칙:
                   * summary 필드를 "##[주요일정]##\n· **직함**: 내용\n\n##[인사발령]##\n· **이름** 직급(소속) - 내용" 형식으로 작성
                   * 사람을 가리키는 표현(위원장/부위원장/직급+이름)은 **볼드**로 감싼다
                   * 인사발령 항목 맨 앞의 문서관리번호(예: "운영지원과-1234 (5678) 2026.1.1. -" 형식)는 내용이 아니므로 제거
                   * 해당 섹션에 내용이 없으면 그 섹션은 통째로 생략, 둘 다 없으면 summary를
                     "주요일정·인사발령 내용 없음"으로
                   * pdfPath·pdfText 필드는 최종 결과물에 포함하지 말 것(로컬 전용 필드)
               - news 카테고리 항목은 제목·요약을 자연스러운 한국어 기사체로 가볍게 다듬는다
                 (원문 왜곡 금지, 매체명·기자명 같은 잡음만 정리).
               - news 중복 판정은 "같은 사건인가"로 한다. 다음 셋이 모두 같으면 같은 사건이다:
                   (1) 대상 기업·기관, (2) 행위 유형(담합·부당지원·허위표시 등),
                   (3) 처분 단계(조사 착수·심의·과징금 부과·소송 등).
                 매체가 다르고 제목 표현이 달라도 이 셋이 같으면 중복이다.
               - 오늘 수집분 안에서 같은 사건이 여러 건이면 가장 정보가 많고 신뢰도 높은
                 출처 1개만 남긴다.
               - 이미 배포된 내용과의 대조는 2단계로 한다:
                   * 먼저 docs/data/index.json 전체를 읽어 지금까지 다룬 사건의 지도를 만든다
                     (하루 한 장의 카드에 title·summary가 있어 전체 이력을 싸게 훑을 수 있다).
                   * 그다음 docs/data/briefings/ 중 파일명 날짜 내림차순으로 최근 14개 파일을
                     열어 항목 단위로 대조한다.
                 지도에 이미 있는 사건이면 몇 주 전 것이라도 중복으로 본다 — 같은 사건이
                 시차를 두고 다른 매체에서 다시 보도되는 경우가 흔하기 때문이다.
               - 다만 후속 보도라도 새로운 사실이 추가됐으면 싣는다. 새로운 사실이란
                 과징금 액수 확정, 판결 선고, 새 조사 착수, 처분 단계의 변화처럼 사건이
                 실제로 진전된 것을 말한다. 같은 사실을 다시 풀어 쓴 것이면 제외한다.
               - 이렇게 다 걸러내고 나서 남는 항목이 하나도 없으면, 새 브리핑을 만들지 말고
                 tool/pending/today.json과 tool/pending/today-pdfs/만 삭제한 뒤 6번으로 간다.

            4. id 값을 날짜로 써서:
               - docs/data/briefings/<id>.json 이 이미 있으면: 기존 items에 새 항목을
                 이어붙이고(중복 source_url 제외), title·summary를 전체 내용 기준으로
                 새로 작성한다.
               - 없으면: 새로 생성한다. items는 press → committee → news 순서로 정렬한다.
                 파일 구조는 기존 docs/data/briefings/ 파일들과 동일하게
                 (id, date, title, summary, competitors, keywords, items, generated_at) 맞춘다.
               - news 항목끼리는 아래 중요도 순서로 배열한다(위가 먼저). 화면은 배열 순서를
                 그대로 그리므로 이 순서가 곧 독자가 보는 순서다:
                   1) 진행 중인 절차 — 현장조사 착수, 심의 상정, 전원회의 회부, 공판
                   2) 제도·정책 — 법령·지침 개정, 입법 동향, 공정위 정책 발표
                   3) 확정된 처분·법원 판단 — 과징금 부과, 고발, 시정명령, 판결 선고
                   4) 해설·전망·오피니언 — 칼럼, 기고, 업계 관측, 기획기사
                 같은 단계 안에서는 과징금 규모·기업 규모·업계 파급이 큰 것을 앞에 둔다.
                 어느 단계인지 애매하면 위 단계로 올리지 말고 아래 단계에 둔다.
                 기존 파일에 이어붙이는 경우에도 news 전체를 이 기준으로 다시 정렬한다.
               - title은 30자 내외로 가장 대표성 있는 사건 중심, summary는 2~4문장으로
                 핵심 사건들을 정리한다(과장하지 말고 실제 포함된 내용만).
               - docs/data/index.json의 카드도 같은 내용으로 추가하거나 갱신한다
                 (id·date·title·summary 4개 필드, 날짜 내림차순 정렬 유지).
               - docs/data/latest.json에 방금 만든(또는 갱신한) 브리핑 파일의 내용을 통째로
                 복사해 덮어쓴다. 가공하지 말고 <id>.json과 완전히 같은 내용이어야 한다.
                 외부 도구가 날짜를 몰라도 고정 주소 하나로 항상 최신 브리핑을 읽게 하려는
                 것이므로, 브리핑을 새로 쓰거나 갱신할 때마다 빠짐없이 함께 갱신한다.

            5. 처리 끝난 tool/pending/today.json과 tool/pending/today-pdfs/ 폴더는 삭제한다.

            6. 변경사항을 main 브랜치에 직접 커밋하고 푸시한다. PR을 만들지 말 것.
               git 사용자 정보는 이미 설정되어 있다. 다음을 실행한다:
                 git add -A
                 git commit -m "brief: <id> (GitHub Actions 자동 배포)"
                 git push origin main
               변경사항이 없으면(git diff --cached --quiet) 커밋하지 않고 넘어간다.
               푸시가 non-fast-forward로 거부되면 git pull --rebase origin main 후 다시 푸시한다.

            7. 마지막에 무엇을 배포했는지(또는 새로 배포할 게 없었는지) 1~2문장으로 요약해 출력한다.
