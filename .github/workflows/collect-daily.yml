name: 평일 아침 FTC 원문 자동 수집

# 매일 KST 09:00(UTC 00:00, 같은 날짜)에 평일(월~금, KST 기준)만 실행.
# UTC 00:00 + 9시간 = KST 09:00(날짜가 안 바뀌므로 cron 요일도 그대로 월~금).
on:
  schedule:
    - cron: "0 0 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm install

      - name: (임시 디버그) 러너의 날짜·시각 인식 확인
        run: |
          echo "shell date -u: $(date -u)"
          node -e 'console.log("Node Date.now ISO:", new Date().toISOString()); console.log("Intl Asia/Seoul:", new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Seoul"}).format(new Date()));'

      - name: 공정위 원문 수집 (Claude API 미사용, serper.dev 키만 필요)
        run: node tool/pipeline/collectForAutomation.js
        env:
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}

      - name: 수집 결과를 저장소에 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tool/pending
          if git diff --cached --quiet; then
            echo "새로 수집된 항목이 없습니다."
          else
            git commit -m "auto: FTC 원문 수집 $(date -u -d '+9 hours' +%F 2>/dev/null || date -u +%F) (KST)"
            git push
          fi
