name: 매일 아침 FTC 원문 자동 수집

# 1순위 실행은 Make가 매일 08:35(KST)에 workflow_dispatch로 부른다.
# 아래 예약은 그 뒤를 받치는 보강용이다.
#
# 왜 보강이 필요한가 — GitHub 러너에서 ftc.go.kr 연결이 자주 끊긴다.
# (UND_ERR_CONNECT_TIMEOUT, 5회 재시도 모두 실패. 같은 시각 다른 망에서는 정상.
#  공개 프록시도 522로 막히는 걸 보면 해외 데이터센터 IP가 차단되는 것으로 보인다.)
# 연결 자체가 안 되는 상황이라 타임아웃을 늘려도 소용없고, 시간을 두고 다시
# 시도하는 수밖에 없다. 실제로 같은 날에도 실패했다가 한 시간 뒤 성공하곤 했다.
#
#   00:20 UTC = KST 09:20  (1차 보강)
#   01:10 UTC = KST 10:10  (2차 보강)
#   02:05 UTC = KST 11:05  (3차 보강)
#
# 아래 가드가 "게시판까지 제대로 읽은 수집"이 이미 있는 날은 보강 실행을 건너뛴다.
# 뉴스만 받고 게시판을 놓친 반쪽 수집은 미완으로 보고 다시 시도한다 — 보도자료와
# 위원회 소식이 이 브리핑의 핵심이라 그것 없이는 수집됐다고 볼 수 없다.
on:
  schedule:
    - cron: "20 0 * * *"
    - cron: "10 1 * * *"
    - cron: "5 2 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

# 보강 예약이 겹쳐 두 번 도는 일을 막는다.
concurrency:
  group: collect-daily
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 그날 "게시판까지 성공한" 수집이 이미 있으면 보강 실행은 아무것도 하지 않는다.
      # 수동 실행(Make 포함)은 다시 받고 싶다는 뜻이므로 건너뛰지 않는다.
      - name: 오늘 수집이 온전한지 확인
        id: guard
        env:
          EVENT: ${{ github.event_name }}
        run: |
          kst=$(TZ=Asia/Seoul date +%F)
          echo "오늘(KST) = $kst"
          f="tool/collected/$kst.json"
          skip=false

          if [ "$EVENT" != "workflow_dispatch" ] && [ -f "$f" ]; then
            ok=$(node -p "
              try {
                const meta = require('./$f')._meta || {};
                const errs = (meta.errors || []).join(' ');
                // 게시판 조회 실패가 하나라도 기록돼 있으면 미완으로 본다
                /보도자료|위원회 소식 조회 실패|게시판/.test(errs) ? 'no' : 'yes';
              } catch (e) { 'no' }
            ")
            if [ "$ok" = "yes" ]; then
              skip=true
              echo "오늘 수집이 이미 온전합니다 — 이번 실행은 건너뜁니다."
            else
              echo "오늘 수집은 있으나 게시판을 놓쳤습니다 — 다시 시도합니다."
            fi
          fi

          echo "skip=$skip" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        if: steps.guard.outputs.skip == 'false'
        with:
          node-version: "20"

      - run: npm install
        if: steps.guard.outputs.skip == 'false'

      - name: 공정위 원문 수집 (Claude API 미사용, serper.dev 키만 필요)
        if: steps.guard.outputs.skip == 'false'
        run: node tool/pipeline/collectForAutomation.js
        env:
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}

      # today.json은 매일 덮어쓰이므로, 원본을 날짜별로 따로 남긴다.
      # tool/pending/은 배포 워크플로우가 처리 후 삭제하기 때문에 바깥에 보관한다.
      - name: 수집 원본을 날짜별로 보관
        if: steps.guard.outputs.skip == 'false'
        run: |
          if [ -f tool/pending/today.json ]; then
            mkdir -p tool/collected
            id=$(node -p "require('./tool/pending/today.json').id")
            cp tool/pending/today.json "tool/collected/$id.json"
            echo "보관: tool/collected/$id.json"
          fi

      - name: 수집 결과를 저장소에 커밋
        if: steps.guard.outputs.skip == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tool/pending tool/collected
          if git diff --cached --quiet; then
            echo "새로 수집된 항목이 없습니다."
          else
            git commit -m "auto: FTC 원문 수집 $(TZ=Asia/Seoul date +%F) (KST)"
            git pull --rebase origin main
            git push
          fi
